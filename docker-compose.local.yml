# Local development dependencies for pg-inspector: Postgres + Redis.
# Production runs inside the shared `pritika` network on the host VM via
# docker-compose.yml.
#
# Quick start:
#   docker compose -f docker-compose.local.yml up -d
#   psql $DATABASE_URL -c 'SELECT 1'
#
# Stop:
#   docker compose -f docker-compose.local.yml down
# Wipe data:
#   docker compose -f docker-compose.local.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-inspector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pg_inspector
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: pg_scenarios
    ports:
      - "5432:5432"
    volumes:
      - pg_inspector_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg_inspector -d pg_scenarios"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pg-inspector-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pg_inspector_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_inspector_pg_data:
  pg_inspector_redis_data:
